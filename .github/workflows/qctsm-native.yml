name: qctsm native builds

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qctsm-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: qctsm shared core source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Export and independently verify reproducible SDK sources
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/qctsm-export-core.py --output-dir "$RUNNER_TEMP/qctsm-core-source"
          python tools/qctsm-export-core.py --output-dir "$RUNNER_TEMP/qctsm-core-repeat"
          python - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifests = [json.loads((root/name/'qctsm-core-manifest.json').read_text()) for name in ('qctsm-core-source', 'qctsm-core-repeat')]
          assert manifests[0] == manifests[1], 'SDK exports differ'
          manifest = manifests[0]
          assert manifest['commit'] == os.environ['CANDIDATE_HEAD'] and manifest['dirty'] is False
          for name in ('qctsm-core-source', 'qctsm-core-repeat'):
              archive = root/name/manifest['archive']
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['archive_sha256']
              with tarfile.open(archive, 'r:gz') as source:
                  assert set(source.getnames()) == set(manifest['files']) | {'qctsm-core-manifest.json'}
                  for path, digest in manifest['files'].items():
                      assert hashlib.sha256(source.extractfile(path).read()).hexdigest() == digest
          identity = {'candidateHead':manifest['commit'], 'runId':os.environ['GITHUB_RUN_ID'], 'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']), 'archiveSha256':manifest['archive_sha256']}
          (root/'qctsm-core-source/ci-identity.json').write_text(json.dumps(identity, indent=2)+'\n')
          print(json.dumps(identity, indent=2))
          PY
      - name: Upload the fixed shared core snapshot and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qctsm-core-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qctsm-core-source/*
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  matrix:
    name: qctsm build configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      configurations: ${{ steps.configurations.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the shared build variants
        id: configurations
        run: python3 .github/scripts/qctsm-native-ci.py matrix
      - name: Verify immutable artifact selection rules
        run: python3 -B .github/scripts/test_qctsm_ci.py

  native:
    name: qctsm ${{ matrix.id }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      QCOPILOTS_TOOL_SEMANTIC_MATCHING_CI_ID: ${{ matrix.id }}
      QCOPILOTS_TOOL_SEMANTIC_MATCHING_VARIANT: ${{ matrix.id }}
      QCOPILOTS_TOOL_SEMANTIC_MATCHING_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QCOPILOTS_TOOL_SEMANTIC_MATCHING_CI_CONTAINER: ${{ matrix.container != '' && '1' || '0' }}
      QCOPILOTS_TOOL_SEMANTIC_MATCHING_CI_CONTAINER_IMAGE: ${{ matrix.container }}
      QCOPILOTS_TOOL_SEMANTIC_MATCHING_KEEP_FAILED_TESTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prepare the pinned CUDA container
        if: matrix.container != ''
        timeout-minutes: 15
        working-directory: /
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git curl tar gzip unzip python3 python3-venv passwd
      - name: Checkout source commit
        timeout-minutes: 10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: 'qctsm-src'
          persist-credentials: false
      - name: Set up Python for developer tooling
        timeout-minutes: 10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Initialize isolated runner directories
        timeout-minutes: 5
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" initialize
      - name: Install the locked container CMake toolchain
        if: matrix.container != ''
        timeout-minutes: 10
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" toolchain
      - name: Install Linux host libraries and test display
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          qctsm_sudo=()
          if [ "$(id -u)" != 0 ]; then qctsm_sudo=(sudo); fi
          . /etc/os-release
          case "${ID}:${VERSION_ID}" in
            ubuntu:22.04) qctsm_gtk_runtime=libgtk-3-0 ;;
            ubuntu:24.04) qctsm_gtk_runtime=libgtk-3-0t64 ;;
            *) printf 'Unsupported Linux dependency baseline: %s:%s\n' "$ID" "$VERSION_ID" >&2; exit 1 ;;
          esac
          "${qctsm_sudo[@]}" apt-get update
          "${qctsm_sudo[@]}" apt-get install --no-install-recommends -y build-essential ninja-build pkg-config dbus-daemon libxcb1-dev \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libdbus-1-dev libx11-xcb-dev libxcb-cursor0 "${qctsm_gtk_runtime}" \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxkbcommon-x11-0 \
            libpulse0 xvfb xauth dpkg-dev file patchelf fonts-noto-cjk fonts-dejavu-core
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install ninja
      - name: Reuse the pinned upstream Windows CUDA SDK setup
        if: runner.os == 'Windows' && matrix.backend == 'cuda'
        timeout-minutes: 45
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-cuda@620d2225cc436ab0b001e3200e590e3b286ef9ab
        with:
          cuda_version: ${{ matrix.toolkitVersion }}
          cuda_arch: x64
      - name: Record Windows ROCm disk space before SDK setup
        if: runner.os == 'Windows' && matrix.backend == 'hip'
        shell: pwsh
        run: |
          $qctsmDrive = Get-PSDrive -Name C
          Write-Output "ROCm SDK setup initial free bytes: $($qctsmDrive.Free)"
      - name: Reuse the pinned upstream Windows ROCm SDK setup
        if: runner.os == 'Windows' && matrix.backend == 'hip'
        timeout-minutes: 45
        uses: ggml-org/llama.cpp/.github/actions/windows-setup-rocm@620d2225cc436ab0b001e3200e590e3b286ef9ab
        env:
          PIP_NO_CACHE_DIR: '1'
        with:
          version: ${{ matrix.toolkitVersion }}
      - name: Record Windows ROCm disk space after SDK setup
        if: always() && runner.os == 'Windows' && matrix.backend == 'hip'
        shell: pwsh
        run: |
          $qctsmDrive = Get-PSDrive -Name C
          Write-Output "ROCm SDK setup remaining free bytes: $($qctsmDrive.Free)"
      - name: Select the upstream ROCm Python environment
        if: runner.os == 'Windows' && matrix.backend == 'hip'
        shell: pwsh
        run: |
          $qctsmRocmPython = 'C:\TheRock\build\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $qctsmRocmPython -PathType Leaf)) {
            throw 'The pinned upstream ROCm setup did not create its Python environment'
          }
          "QCOPILOTS_TOOL_SEMANTIC_MATCHING_ROCM_PYTHON=$qctsmRocmPython" >> $env:GITHUB_ENV
      - name: Restore immutable model cache
        timeout-minutes: 15
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.QCOPILOTS_TOOL_SEMANTIC_MATCHING_MODEL_DIR }}
          key: qctsm-models-${{ hashFiles('qctsm-src/config/qctsm-models.lock.json') }}-gemma-v3
      - name: Bootstrap locked Qt and backend SDK
        timeout-minutes: 60
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" bootstrap
      - name: Diagnose native toolchain and available hardware
        timeout-minutes: 10
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" doctor
      - name: Configure selected backend
        timeout-minutes: 30
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" configure
      - name: Build
        timeout-minutes: 120
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" build
      - name: Download and verify required real models
        timeout-minutes: 35
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" models
      - name: Run all functional and real-model numerical tests
        timeout-minutes: 90
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" test
      - name: Install staging tree
        timeout-minutes: 20
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" install
      - name: Package and verify portable deployment
        timeout-minutes: 45
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" package
      - name: Install and remove the final installer
        if: runner.os == 'Windows' || runner.os == 'Linux'
        timeout-minutes: 45
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" installers
      - name: Validate the exact user package set
        id: packages
        timeout-minutes: 10
        run: python "qctsm-src/.github/scripts/qctsm-native-ci.py" products
      - name: Upload the first user package
        timeout-minutes: 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.packages.outputs.package_1_name }}
          path: ${{ steps.packages.outputs.package_1_path }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload the second user package
        if: steps.packages.outputs.package_2_path != ''
        timeout-minutes: 20
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.packages.outputs.package_2_name }}
          path: ${{ steps.packages.outputs.package_2_path }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: qctsm all native combinations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs: [core, matrix, native]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout artifact selector
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify all required native jobs
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: test "$CORE_RESULT" = success && test "$MATRIX_RESULT" = success && test "$NATIVE_RESULT" = success
      - name: Verify immutable package artifact identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 .github/scripts/qctsm-artifact-selection.py collect \
            --output-dir "$RUNNER_TEMP/qctsm-selected-artifacts" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --candidate-head "$CANDIDATE_HEAD" --attempt "$GITHUB_RUN_ATTEMPT"
